<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Albert Canades — AR</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.2.0/dist/aframe.min.js"></script>
  <script src="aframe-ar.js"></script>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: #000; }
    #status {
      position: fixed; top: 18px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8); color: #08d9d6;
      font: bold 13px 'Courier New', monospace;
      padding: 10px 22px; border-radius: 20px;
      border: 1px solid #08d9d6;
      z-index: 99999; pointer-events: none; white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="status">✦ Apunta la càmera al marcador Hiro</div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-marker preset="hiro" id="mk"></a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
  const U = 0.13; // mida vòxel

  /* Afegeix un a-box fill del marcador */
  function box(cx, cy, cz, w, h, d, color) {
    const el = document.createElement('a-box');
    el.setAttribute('position', `${cx*U} ${cy*U} ${cz*U}`);
    el.setAttribute('width',    w * U);
    el.setAttribute('height',   h * U);
    el.setAttribute('depth',    d * U);
    el.setAttribute('color', color);
    el.setAttribute('shader', 'flat');
    el.setAttribute('roughness', '0');
    document.getElementById('mk').appendChild(el);
    return el;
  }

  function buildScene() {
    /* ── TERRA ─────────────────────────────────── */
    for (let x = 0; x < 9; x++)
      for (let z = 0; z < 9; z++)
        box(x-4, 0, z-4, 0.94, 0.2, 0.94,
          (x+z)%2===0 ? '#1a1035' : '#14092c');

    /* ── PARET FONS (z negativa) ─────────────── */
    for (let x = 0; x < 9; x++)
      for (let y = 1; y <= 7; y++)
        box(x-4, y, -4.5, 0.94, 0.94, 0.2,
          y<=2 ? '#2a1f1a' : '#1a3a5e');

    /* ── PARET ESQUERRA (x negativa) ────────── */
    for (let z = 0; z < 9; z++)
      for (let y = 1; y <= 7; y++)
        box(-4.5, y, z-4, 0.2, 0.94, 0.94,
          y<=2 ? '#221a16' : '#143050');

    /* ── ESCRIPTORI en L ─────────────────────── */
    for (let x = -4; x <= -1; x++) box(x, 3.4, -3.5, 0.94, 0.28, 0.94, '#8B5E3C');
    for (let z = -3; z <= -1; z++) box(-3.5, 3.4, z,  0.94, 0.28, 0.94, '#7a5130');
    box(-4, 1.7, -3.5, 0.35, 2.8, 0.35, '#6B4423');
    box(-1, 1.7, -3.5, 0.35, 2.8, 0.35, '#6B4423');
    box(-4, 1.7, -1,   0.35, 2.8, 0.35, '#6B4423');

    /* ── MONITORS ────────────────────────────── */
    box(-2.5, 3.8, -4.1, 0.4, 0.5, 0.4, '#111122');
    box(-3.5, 5.2, -4.2, 2.2, 1.6, 0.18, '#0d0d1e');
    const scL = box(-3.5, 5.2, -4.12, 1.9, 1.3, 0.1, '#08d9d6');
    box(-1.0, 5.2, -4.2, 2.2, 1.6, 0.18, '#0d0d1e');
    const scR = box(-1.0, 5.2, -4.12, 1.9, 1.3, 0.1, '#4ade80');

    /* ── TECLAT ──────────────────────────────── */
    box(-2.5, 3.52, -3.2, 3.0, 0.18, 0.85, '#334155');

    /* ── CADIRA ──────────────────────────────── */
    box(-2.5, 2.4, -1.5, 2.5, 0.28, 2.5, '#533483');
    box(-2.5, 3.7, -0.5, 2.5, 2.5, 0.28, '#3b2272');
    box(-3.5, 1.2, -2.5, 0.3, 2.2, 0.3, '#2d1b4e');
    box(-1.5, 1.2, -2.5, 0.3, 2.2, 0.3, '#2d1b4e');
    box(-3.5, 1.2, -0.5, 0.3, 2.2, 0.3, '#2d1b4e');
    box(-1.5, 1.2, -0.5, 0.3, 2.2, 0.3, '#2d1b4e');

    /* ── PERSONATGE ──────────────────────────── */
    box(-3.0, 1.4, -2.0, 0.8, 2.0, 0.8, '#2d3748');
    box(-2.0, 1.4, -2.0, 0.8, 2.0, 0.8, '#2d3748');
    box(-2.5, 3.2, -2.5, 2.0, 1.8, 1.4, '#4a6fa5');
    box(-2.5, 4.4, -2.6, 0.6, 0.4, 0.6, '#f5c5a3');
    box(-2.5, 5.1, -2.6, 1.4, 1.4, 1.3, '#f5c5a3');
    box(-2.5, 5.8, -2.5, 1.5, 0.5, 1.4, '#1a0a2e');
    box(-3.8, 3.0, -3.0, 0.8, 0.7, 1.2, '#4a6fa5');
    box(-3.8, 2.9, -3.6, 0.7, 0.5, 0.6, '#f5c5a3');
    box(-1.2, 3.0, -3.0, 0.8, 0.7, 1.2, '#4a6fa5');
    box(-1.2, 2.9, -3.6, 0.7, 0.5, 0.6, '#f5c5a3');

    /* ── PRESTATGE ───────────────────────────── */
    box(2.0, 5.0, -3.5, 3.0, 0.22, 0.7, '#8B5E3C');
    box(1.0, 5.5, -3.6, 0.5, 1.0, 0.5, '#7dd3fc');
    box(1.8, 5.5, -3.6, 0.5, 0.8, 0.5, '#e94560');
    box(2.5, 5.5, -3.6, 0.5, 1.1, 0.5, '#4ade80');

    /* ── PLANTA ──────────────────────────────── */
    box(3.5, 0.5, 3.5, 0.9, 1.1, 0.9, '#ffffff');
    box(3.5, 1.5, 3.5, 1.0, 1.2, 1.0, '#16a34a');
    box(3.5, 2.5, 3.5, 0.7, 0.7, 0.7, '#22c55e');

    /* ── TASSA ───────────────────────────────── */
    box(-0.5, 3.7, -3.6, 0.55, 0.8, 0.55, '#e94560');

    /* ── Animació pantalles ──────────────────── */
    const cols = ['#08d9d6','#4ade80','#7dd3fc','#f0abfc','#fbbf24'];
    let ci = 0;
    setInterval(() => {
      ci = (ci+1) % cols.length;
      scL.setAttribute('color', cols[ci]);
      scR.setAttribute('color', cols[(ci+2) % cols.length]);
    }, 500);
  }

  /* Construir quan l'escena estigui llesta */
  document.querySelector('a-scene').addEventListener('loaded', buildScene);

  /* ── UI ──────────────────────────────────────────────── */
  const st = document.getElementById('status');
  document.getElementById('mk').addEventListener('markerFound', () => {
    st.textContent       = '▲ Albert Canades · AI Developer';
    st.style.color       = '#4ade80';
    st.style.borderColor = '#4ade80';
  });
  document.getElementById('mk').addEventListener('markerLost', () => {
    st.textContent       = '✦ Apunta la càmera al marcador Hiro';
    st.style.color       = '#08d9d6';
    st.style.borderColor = '#08d9d6';
  });

  window.onerror = (msg) => {
    st.textContent = 'ERR: ' + msg.substring(0, 55);
    st.style.color = '#e94560';
  };
  </script>
</body>
</html>
