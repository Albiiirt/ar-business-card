<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Albert Canades — AR</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.2.0/dist/aframe.min.js"></script>
  <script src="aframe-ar.js"></script>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: #000; }
    #status {
      position: fixed; top: 18px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: #08d9d6;
      font: bold 13px 'Courier New', monospace;
      padding: 10px 22px; border-radius: 20px;
      border: 1px solid #08d9d6;
      z-index: 99999; pointer-events: none; white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="status">✦ Apunta la càmera al marcador Hiro</div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <img id="f0" src="f0.png" crossorigin="anonymous">
      <img id="f1" src="f1.png" crossorigin="anonymous">
      <img id="f2" src="f2.png" crossorigin="anonymous">
      <img id="f3" src="f3.png" crossorigin="anonymous">
    </a-assets>

    <a-marker preset="hiro" id="mk">
      <a-image
        id="arimg"
        src="#f0"
        position="0 0.01 0"
        rotation="-90 0 0"
        width="1.8"
        height="1.8"
      ></a-image>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    let fi = 0;
    const frames = ['#f0','#f1','#f2','#f3'];
    const arimg  = document.getElementById('arimg');

    document.querySelector('a-scene').addEventListener('loaded', () => {
      setInterval(() => {
        fi = (fi + 1) % frames.length;
        arimg.setAttribute('src', frames[fi]);
      }, 400);
    });

    const st = document.getElementById('status');
    document.getElementById('mk').addEventListener('markerFound', () => {
      st.textContent       = '▲ Albert Canades · AI Developer';
      st.style.color       = '#4ade80';
      st.style.borderColor = '#4ade80';
    });
    document.getElementById('mk').addEventListener('markerLost', () => {
      st.textContent       = '✦ Apunta la càmera al marcador Hiro';
      st.style.color       = '#08d9d6';
      st.style.borderColor = '#08d9d6';
    });
  </script>
</body>
</html>
