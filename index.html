    let ci=0;
    setInterval(()=>{
      ci=(ci+1)%cols.length;
      const L=document.getElementById('scL');
      const R=document.getElementById('scR');
      if(L)L.setAttribute('color',cols[ci]);
      if(R)R.setAttribute('color',cols[(ci+2)%cols.length]);
    },500);
    const st=document.getElementById('status');
    document.getElementById('mk').addEventListener('markerFound',()=>{
      st.textContent='▲ Albert Canades · AI Developer';
      st.style.color='#4ade80';st.style.borderColor='#4ade80';
    });
    document.getElementById('mk').addEventListener('markerLost',()=>{
      st.textContent='✦ Apunta la càmera al marcador Hiro';
      st.style.color='#08d9d6';st.style.borderColor='#08d9d6';
