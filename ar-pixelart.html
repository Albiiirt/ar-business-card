<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>AR Pixel Art — Albert Canades</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; overflow: hidden; touch-action: none; }

    #cam-canvas { position: absolute; top: 0; left: 0; }
    #art-canvas { position: absolute; top: 0; left: 0; }

    #hint {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.72); color: #08d9d6;
      font: bold 12px 'Courier New', monospace;
      padding: 8px 18px; border-radius: 16px; border: 1px solid #08d9d6;
      pointer-events: none; white-space: nowrap; z-index: 10;
    }

    #controls {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.55); border-radius: 8px;
      padding: 10px 16px; min-width: 240px;
      display: flex; flex-direction: column; gap: 6px;
      z-index: 10; font-family: monospace; font-size: 12px; color: #ccc;
    }
    .ctrl-row { display: flex; align-items: center; gap: 8px; }
    .ctrl-row label { white-space: nowrap; min-width: 90px; }
    .ctrl-row input[type="range"] { flex: 1; accent-color: #08d9d6; cursor: pointer; }
    #cam-toggle {
      background: #08d9d6; color: #000; border: none;
      padding: 6px 12px; border-radius: 4px;
      font: bold 11px monospace; cursor: pointer;
      align-self: center; margin-top: 2px;
    }
  </style>
</head>
<body>
  <canvas id="cam-canvas"></canvas>
  <canvas id="art-canvas"></canvas>

  <div id="hint">Tap to reposition · drag slider to scale</div>

  <div id="controls">
    <div class="ctrl-row">
      <label>Pixel: <strong id="px-val">6</strong></label>
      <input id="pixel-slider" type="range" min="2" max="14" value="6">
    </div>
    <div class="ctrl-row">
      <label>X: <strong id="ox-val">0</strong></label>
      <input id="ox-slider" type="range" min="-200" max="200" value="0">
    </div>
    <div class="ctrl-row">
      <label>Y: <strong id="oy-val">0</strong></label>
      <input id="oy-slider" type="range" min="-200" max="200" value="0">
    </div>
    <button id="cam-toggle">Hide cam</button>
  </div>

  <script>
    // ── Canvas & resize ───────────────────────────────────────────────
    const camCanvas = document.getElementById('cam-canvas');
    const artCanvas = document.getElementById('art-canvas');
    const camCtx    = camCanvas.getContext('2d');
    const artCtx    = artCanvas.getContext('2d');

    let W = 0, H = 0;

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      camCanvas.width = artCanvas.width = W;
      camCanvas.height = artCanvas.height = H;
    }
    resize();
    window.addEventListener('resize', () => { resize(); resetOrigin(); });

    // ── Scene state ───────────────────────────────────────────────────
    let BASE_PIXEL = 6;
    let originX = 0, originY = 0;
    let offsetX = 0, offsetY = 0;
    let showCamera = true;

    function resetOrigin() {
      originX = W * 0.5 + offsetX;
      originY = H * 0.42 + offsetY;
    }
    resetOrigin();

    // ── Camera feed ───────────────────────────────────────────────────
    const video = document.createElement('video');
    video.autoplay = true;
    video.playsInline = true;
    video.muted = true;

    navigator.mediaDevices
      .getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false })
      .then(stream => { video.srcObject = stream; video.play(); })
      .catch(() => { showCamera = false; camCanvas.style.display = 'none'; });

    function drawCamera() {
      if (!showCamera || video.readyState < 2) return;
      const vw = video.videoWidth, vh = video.videoHeight;
      if (!vw) return;
      const scale = Math.max(W / vw, H / vh);
      const dw = vw * scale, dh = vh * scale;
      camCtx.drawImage(video, (W - dw) / 2, (H - dh) / 2, dw, dh);
    }

    // ── Isometric math ────────────────────────────────────────────────
    // World axes: +x → screen right-down, +z → screen left-down, +y → screen up
    // toScreen maps world (wx,wy,wz) → canvas pixel (x,y)
    function toScreen(wx, wy, wz) {
      const TW = BASE_PIXEL * 4;   // screen pixels per world unit (horizontal)
      const TH = BASE_PIXEL * 2;   // screen pixels per world unit (vertical tile)
      const VH = BASE_PIXEL * 2;   // screen pixels per world unit (height)
      return {
        x: originX + (wx - wz) * TW / 2,
        y: originY + (wx + wz) * TH / 2 - wy * VH
      };
    }

    function fillPoly(ctx, pts, color) {
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    }

    /**
     * drawIsoBlock(ctx, x, y, z, w, h, d, colorTop, colorLeft, colorRight)
     *
     *   x,y,z        – bottom-front-left corner in world units
     *   w,h,d        – size in x (width), y (height), z (depth)
     *   colorTop     – top face   (brightest)
     *   colorLeft    – left face  (−Z face, mid brightness)
     *   colorRight   – right face (+X face, darkest)
     *
     * Projection:
     *   screenX = originX + (x − z) × TW/2
     *   screenY = originY + (x + z) × TH/2 − y × VH
     *
     * Visible faces from isometric camera (above + NE):
     *   Top   → rhombus at y+h
     *   Left  → −Z parallelogram (front face, left on screen)
     *   Right → +X parallelogram (side face, right on screen)
     */
    function drawIsoBlock(ctx, x, y, z, w, h, d, cTop, cLeft, cRight) {
      const VH = BASE_PIXEL * 2;

      // Top-face corners (all at world-y = y+h)
      const tfl = toScreen(x,     y + h, z);      // front-left
      const tfr = toScreen(x + w, y + h, z);      // front-right
      const tbr = toScreen(x + w, y + h, z + d);  // back-right
      const tbl = toScreen(x,     y + h, z + d);  // back-left

      const drop = h * VH;  // pixel offset to bottom row

      // Top face
      fillPoly(ctx, [tfl, tfr, tbr, tbl], cTop);

      // Left face (−Z, front-left parallelogram)
      fillPoly(ctx, [
        tfl, tfr,
        { x: tfr.x, y: tfr.y + drop },
        { x: tfl.x, y: tfl.y + drop }
      ], cLeft);

      // Right face (+X, front-right parallelogram)
      fillPoly(ctx, [
        tfr, tbr,
        { x: tbr.x, y: tbr.y + drop },
        { x: tfr.x, y: tfr.y + drop }
      ], cRight);
    }

    // Auto-shade a hex color: returns [top, left, right] variants
    function shades(hex) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      const mk = (f) => `rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`;
      return [mk(1.0), mk(0.75), mk(0.55)];
    }

    // Shorthand: single base color, faces auto-shaded
    function block(ctx, x, y, z, w, h, d, hex) {
      const [cT, cL, cR] = shades(hex);
      drawIsoBlock(ctx, x, y, z, w, h, d, cT, cL, cR);
    }

    // ── Palette ───────────────────────────────────────────────────────
    const C = {
      floorA:  '#C49A6C',  // warm wood light
      floorB:  '#B5895B',  // warm wood dark
      wallA:   '#F0C4A0',  // peach wall light
      wallB:   '#E2B090',  // peach wall mid
      wallDark:'#C89070',  // peach wall shadow
      skirting:'#D4A870',  // skirting board
    };

    // ── Room base ─────────────────────────────────────────────────────
    // Grid is 8×8 tiles. Each tile = 1 world unit.
    // Origin of room: back-left corner at world (0, 0, 0).
    // Floor spans x: 0..8, z: 0..8, y=0..0.15 (thin slab).
    // Back wall:  z = 0, spans x: 0..8, y: 0..6, d=0.08
    // Left wall:  x = 0, spans z: 0..8, y: 0..6, w=0.08
    const ROOM = 8;   // tiles wide & deep
    const WALL_H = 6; // wall height in world units
    const WALL_T = 0.08;
    const FLOOR_T = 0.14;

    function drawRoom(ctx) {
      // ── Floor tiles (back-to-front painter order: low-x low-z first) ──
      for (let xi = 0; xi < ROOM; xi++) {
        for (let zi = 0; zi < ROOM; zi++) {
          const hex = (xi + zi) % 2 === 0 ? C.floorA : C.floorB;
          block(ctx, xi, 0, zi, 1, FLOOR_T, 1, hex);
        }
      }

      // ── Skirting boards (thin strip at wall base) ─────────────────
      // Along back wall (z=0)
      for (let xi = 0; xi < ROOM; xi++) {
        block(ctx, xi, FLOOR_T, 0, 1, 0.12, WALL_T, C.skirting);
      }
      // Along left wall (x=0)
      for (let zi = 0; zi < ROOM; zi++) {
        block(ctx, 0, FLOOR_T, zi, WALL_T, 0.12, 1, C.skirting);
      }

      // ── Back wall (z = 0, facing +z) ─────────────────────────────
      // 8 columns × WALL_H rows of blocks, painted bottom→top, left→right
      for (let xi = 0; xi < ROOM; xi++) {
        for (let yi = 0; yi < WALL_H; yi++) {
          const hex = (xi + yi) % 2 === 0 ? C.wallA : C.wallB;
          block(ctx, xi, FLOOR_T + yi, 0, 1, 1, WALL_T, hex);
        }
      }

      // ── Left wall (x = 0, facing +x) ─────────────────────────────
      for (let zi = 0; zi < ROOM; zi++) {
        for (let yi = 0; yi < WALL_H; yi++) {
          const hex = (zi + yi) % 2 === 0 ? C.wallA : C.wallB;
          block(ctx, 0, FLOOR_T + yi, zi, WALL_T, 1, 1, hex);
        }
      }
    }

    // ── Step 3: Window (on left wall, x=0) ───────────────────────────
    // For the x=0 wall: "w" runs along z axis, "d" runs into x axis.
    // Frame: 3 wide (z) × 4 tall (y) × 0.3 deep (x), positioned at (0,2,3)
    function drawWindow(ctx) {
      const wx=0, wy=2, wz=3;
      const ww=0.3, wh=4, wd=3;   // w=x-depth, h=y-height, d=z-span

      // Frame
      drawIsoBlock(ctx, wx, wy, wz, ww, wh, wd, '#8B5E3C', '#6B4423', '#5A3818');

      // Glass pane (inset 0.1 on each side), semi-transparent
      ctx.globalAlpha = 0.7;
      drawIsoBlock(ctx, wx + 0.1, wy + 0.25, wz + 0.25,
                   0.08, 3.5, 2.5, '#AED6F1', '#85C1E9', '#5DADE2');
      ctx.globalAlpha = 1.0;
    }

    // ── Step 3: Bookshelf (against z=7 wall) ─────────────────────────
    function drawBookshelf(ctx) {
      const sx=6, sy=0, sz=7;

      // Frame: 2w × 5h × 0.8d
      drawIsoBlock(ctx, sx, sy, sz, 2, 5, 0.8, '#6B4423', '#4A2E14', '#3A2210');

      // 3 shelf boards at y = 1.5, 3.0, 4.5
      const [bT, bL, bR] = shades('#8B5E3C');
      for (const by of [1.5, 3.0, 4.5]) {
        drawIsoBlock(ctx, sx + 0.1, by, sz + 0.05, 1.8, 0.2, 0.7, bT, bL, bR);
      }

      // 5 books per shelf, 0.36 apart, colours cycling
      const bookC = ['#8B2020','#20528B','#208B20','#8B7020','#6B208B'];
      for (const by of [1.5, 3.0, 4.5]) {
        for (let bi = 0; bi < 5; bi++) {
          block(ctx, sx + 0.1 + bi * 0.36, by + 0.2, sz + 0.08,
                0.3, 1.0, 0.6, bookC[bi % bookC.length]);
        }
      }
    }

    // ── Step 3: Desk (surface at y=2, legs y=0..2) ────────────────────
    function drawDesk(ctx) {
      const dx=2, dy=2, dz=3, dw=4, dh=0.4, dd=2;

      // Legs sorted back-to-front (ascending x+z)
      const legPts = [
        [dx,        dz],          // x+z = 5
        [dx,        dz+dd-0.4],   // x+z = 6.6
        [dx+dw-0.4, dz],          // x+z = 8.6
        [dx+dw-0.4, dz+dd-0.4],   // x+z = 10.2
      ];
      for (const [lx, lz] of legPts) {
        block(ctx, lx, 0, lz, 0.4, 2, 0.4, '#5A3818');
      }

      // Drawer unit (right side under surface)
      const drX = dx + dw - 1.5;
      drawIsoBlock(ctx, drX, 0, dz + 0.1, 1.5, 2, 1.8,
                   '#7A5230', '#5A3C20', '#4A3018');

      // Drawer handle (centred on drawer front face)
      drawIsoBlock(ctx,
        drX + (1.5 - 0.3) / 2,
        0.85,
        dz + 0.06,
        0.3, 0.2, 0.06,
        '#C8A870', '#B09060', '#9A7850'
      );

      // Surface drawn last (sits on top of legs)
      drawIsoBlock(ctx, dx, dy, dz, dw, dh, dd, '#8B5E3C', '#6B4423', '#5A3818');
    }

    // Floor shadows — drawn first, under all objects
    function drawFloorShadows(ctx) {
      ctx.fillStyle = 'rgba(0,0,0,0.12)';

      const dp = toScreen(4, 0, 4);
      ctx.beginPath();
      ctx.ellipse(dp.x, dp.y, BASE_PIXEL * 16, BASE_PIXEL * 6, 0, 0, Math.PI * 2);
      ctx.fill();

      const cp = toScreen(3.75, 0, 2.25);
      ctx.beginPath();
      ctx.ellipse(cp.x, cp.y, BASE_PIXEL * 10, BASE_PIXEL * 5, 0, 0, Math.PI * 2);
      ctx.fill();

      const pp = toScreen(1.5, 0, 2.5);
      ctx.beginPath();
      ctx.ellipse(pp.x, pp.y, BASE_PIXEL * 8, BASE_PIXEL * 4, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Ambient lighting overlays — drawn last, over everything
    function drawAmbientLight(ctx) {
      const winPos = toScreen(0, 4, 4.5);
      const warmGrad = ctx.createRadialGradient(winPos.x, winPos.y, 0, winPos.x, winPos.y, W * 0.6);
      warmGrad.addColorStop(0, 'rgba(255,220,120,0.12)');
      warmGrad.addColorStop(1, 'rgba(255,220,120,0)');
      ctx.fillStyle = warmGrad;
      ctx.fillRect(0, 0, W, H);

      const coolGrad = ctx.createRadialGradient(W * 0.85, H * 0.85, 0, W * 0.85, H * 0.85, W * 0.5);
      coolGrad.addColorStop(0, 'rgba(80,80,120,0.08)');
      coolGrad.addColorStop(1, 'rgba(80,80,120,0)');
      ctx.fillStyle = coolGrad;
      ctx.fillRect(0, 0, W, H);
    }

    // ── Step 4: Chair — seat at (3,0,2), compact, sits on floor ─────────
    function drawChair(ctx) {
      const sx=3, sy=0, sz=2;
      const sw=1.2, sh=0.3, sd=1.2;

      // Cross base (max 1.4 span)
      const bC = ['#333333','#1A1A1A','#111111'];
      drawIsoBlock(ctx, sx+0.1, 0, sz+0.5, 1.0, 0.1, 0.2, bC[0],bC[1],bC[2]);  // ─
      drawIsoBlock(ctx, sx+0.5, 0, sz+0.1, 0.2, 0.1, 1.0, bC[0],bC[1],bC[2]);  // │

      // Seat cushion
      drawIsoBlock(ctx, sx, sy, sz, sw, sh, sd, '#4A4A6A','#35356A','#252550');

      // Left armrest
      drawIsoBlock(ctx, sx,           sy+sh, sz+0.1, 0.15, 0.4, sd-0.2, '#35356A','#252550','#1A1A40');

      // Backrest
      drawIsoBlock(ctx, sx, sy+sh, sz+sd-0.2, 1.1, 1.5, 0.2, '#4A4A6A','#35356A','#252550');

      // Right armrest
      drawIsoBlock(ctx, sx+sw-0.15, sy+sh, sz+0.1, 0.15, 0.4, sd-0.2, '#35356A','#252550','#1A1A40');
    }

    // ── Step 5: Monitor, keyboard, mouse ─────────────────────────────
    // All sit on desk surface (y ≥ 2.4). Painter order within function:
    //   monitor (z≈4.1, farther back) → keyboard (z≈3.2) → mouse (z≈3.4)
    function drawDeskItems(ctx) {

      // ── Monitor ────────────────────────────────────────────────────
      // Centre at world (3.5, ?, 4.2); offset to bottom-left-front corner.

      // Stand base: 0.6×0.2×0.6, centred → origin (3.2, 2.4, 3.9)
      drawIsoBlock(ctx, 3.2, 2.4, 3.9,  0.6, 0.2, 0.6,  '#2A2A2A','#1A1A1A','#111111');

      // Stand pole: 0.2×1.0×0.2, centred → origin (3.4, 2.6, 4.1)
      drawIsoBlock(ctx, 3.4, 2.6, 4.1,  0.2, 1.0, 0.2,  '#2A2A2A','#1A1A1A','#111111');

      // Screen bezel: 2.2×1.6×0.15, centred x → origin (2.4, 3.6, 4.125)
      drawIsoBlock(ctx, 2.4, 3.6, 4.125, 2.2, 1.6, 0.15, '#222222','#111111','#1A1A1A');

      // Screen display: 2.0×1.4×0.05, inset → origin (2.5, 3.7, 4.13)
      drawIsoBlock(ctx, 2.5, 3.7, 4.13,  2.0, 1.4, 0.05, '#1A3A6A','#0A2A5A','#051A3A');

      // Screen glow – soft blue radial centred on screen face
      const sc = toScreen(3.5, 4.4, 4.155);   // screen centre in world
      const sg = ctx.createRadialGradient(sc.x, sc.y, BASE_PIXEL, sc.x, sc.y, BASE_PIXEL * 18);
      sg.addColorStop(0, 'rgba(50,100,255,0.08)');
      sg.addColorStop(1, 'rgba(50,100,255,0)');
      ctx.fillStyle = sg;  ctx.fillRect(0, 0, W, H);

      // ── Keyboard ───────────────────────────────────────────────────
      // Body: 2×0.2×0.8 at (3.2, 2.4, 3.2)
      drawIsoBlock(ctx, 3.2, 2.4, 3.2, 2.0, 0.2, 0.8, '#CCCCAA','#AAAA88','#888866');

      // 3 key rows stacked along z on top of body (y=2.6), 0.22 gap between rows
      for (let r = 0; r < 3; r++) {
        block(ctx, 3.3, 2.6, 3.30 + r * 0.22, 1.8, 0.05, 0.15, '#BBBB99');
      }

      // ── Mouse ──────────────────────────────────────────────────────
      // Body: 0.4×0.25×0.6 at (5, 2.4, 3.4)
      drawIsoBlock(ctx, 5.0, 2.4, 3.4, 0.4, 0.25, 0.6, '#CCCCAA','#AAAA88','#888866');

      // Scroll wheel: centred on top → (5.15, 2.65, 3.65)
      drawIsoBlock(ctx, 5.15, 2.65, 3.65, 0.1, 0.1, 0.1, '#888866','#666644','#444422');
    }

    // ── Step 6a: Large floor plant — pot at (1.5,0,2), x+z≈3.5 ─────────
    function drawLargePlant(ctx) {
      const pcx = 2.0, pcz = 2.5;   // centre of pot at (1.5,0,2) size 1×1×1

      drawIsoBlock(ctx, 1.5, 0, 2.0,    1.0, 1.0, 1.0, '#C87840','#A06030','#884820'); // pot
      drawIsoBlock(ctx, 1.6, 1.0, 2.1,  0.8, 0.2, 0.8, '#3A1F0A','#2A1205','#1A0A02'); // soil
      drawIsoBlock(ctx, pcx-.15, 1.2, pcz-.15,
                                        0.3, 1.5, 0.3, '#4A3020','#3A2010','#2A1808'); // stem
      // Foliage layers bottom→top (increasing y, shrinking footprint)
      drawIsoBlock(ctx, pcx-1.25, 2.7, pcz-1.25,
                                        2.5, 0.6, 2.5, '#2D6A2D','#1F4F1F','#163816'); // L1
      drawIsoBlock(ctx, pcx-.9,   3.3, pcz-.9,
                                        1.8, 0.6, 1.8, '#3A8A3A','#2A6A2A','#1F501F'); // L2
      drawIsoBlock(ctx, pcx-.5,   3.9, pcz-.5,
                                        1.0, 0.6, 1.0, '#4AAA4A','#3A8A3A','#2A6A2A'); // L3
    }

    // ── Step 6b: Small desk plant ─────────────────────────────────────
    // Pot at (2.2, 2.4, 4.5) — on desk left-back corner. x+z≈7.2
    function drawSmallDeskPlant(ctx) {
      const px=2.2, py=2.4, pz=4.5;

      drawIsoBlock(ctx, px, py, pz,          0.5, 0.5, 0.5, '#C87840','#A06030','#884820');
      drawIsoBlock(ctx, px-.25, py+.5, pz-.25, 1.0, 0.8, 1.0, '#3A8A3A','#2A6A2A','#1F501F');
    }

    // ── Step 6c: Tall corner plant — pot at (1,0,6.5), x+z≈8.5 ─────────
    function drawTallCornerPlant(ctx) {
      const pcx = 1.5, pcz = 7.0;   // centre of pot at (1.0,0,6.5) size 1×1×1

      drawIsoBlock(ctx, 1.0, 0, 6.5,    1.0, 1.0, 1.0, '#A86830','#885020','#663A10'); // pot
      drawIsoBlock(ctx, pcx-.15, 1, pcz-.15,
                                        0.3, 3.0, 0.3, '#4A3020','#3A2010','#2A1808'); // stem
      // Leaf clusters at y=1.5/2.5/3.5, shrinking upward (foliage stays in bounds)
      drawIsoBlock(ctx, pcx-.75, 1.5, pcz-.75,
                                        1.5, 0.5, 1.5, '#2D6A2D','#1F4F1F','#163816');
      drawIsoBlock(ctx, pcx-.6,  2.5, pcz-.6,
                                        1.2, 0.5, 1.2, '#2D6A2D','#1F4F1F','#163816');
      drawIsoBlock(ctx, pcx-.4,  3.5, pcz-.4,
                                        0.8, 0.5, 0.8, '#3A8A3A','#2A6A2A','#1F501F');
    }

    // ── Step 7: Desk lamp, mug, notebook ─────────────────────────────
    function drawDeskSmallItems(ctx) {

      // ── Desk Lamp ─────────────────────────────────────────────────
      const bx=2.3, by=2.4, bz=4.8;
      const bcx = bx+0.25, bcz = bz+0.25;   // base centre x/z

      // Base: 0.5×0.2×0.5 at (bx, by, bz)
      drawIsoBlock(ctx, bx, by, bz, 0.5, 0.2, 0.5, '#222222','#111111','#1A1A1A');

      // Pole bottom: 0.15×1.2×0.15, centred over base
      const px = bcx-0.075, pz = bcz-0.075;
      drawIsoBlock(ctx, px, by+0.2, pz, 0.15, 1.2, 0.15, '#333333','#222222','#1A1A1A');

      // Pole arm: 0.15×0.8×0.8, extends forward (−z) from pole top
      const poleTopY = by+0.2+1.2;           // y = 3.8
      const armZ     = bcz-0.8;              // arm front z = 4.25
      drawIsoBlock(ctx, px, poleTopY, armZ, 0.15, 0.8, 0.8, '#333333','#222222','#1A1A1A');

      // Lamp head: 0.9×0.4×0.9, centred over arm at arm top
      const headY  = poleTopY+0.8;           // y = 4.6
      const armCZ  = armZ+0.4;               // arm centre z = 4.65
      drawIsoBlock(ctx, bcx-0.45, headY, armCZ-0.45, 0.9, 0.4, 0.9, '#CCAA00','#AA8800','#886600');

      // Light cone: filled arc below lamp head
      const lp = toScreen(bcx, headY, armCZ);
      ctx.beginPath();
      ctx.arc(lp.x, lp.y, BASE_PIXEL * 5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,220,100,0.10)';
      ctx.fill();

      // ── Notebook ──────────────────────────────────────────────────
      // Cover: 1×0.08×0.75 at (2.8, 2.4, 3.6)
      drawIsoBlock(ctx, 2.8,  2.4,  3.6,   1.0,  0.08, 0.75, '#E8D5B0','#C8B590','#A89570');
      // Pages: 0.95×0.04×0.7, slightly inset on top
      drawIsoBlock(ctx, 2.825,2.48, 3.625, 0.95, 0.04, 0.7,  '#F5F0E8','#E0DDD8','#D0CCC8');
      // Spine: 0.05×0.12×0.7 on left edge
      drawIsoBlock(ctx, 2.8,  2.4,  3.625, 0.05, 0.12, 0.7,  '#8B6040','#6B4020','#4B2810');

      // ── Mug ───────────────────────────────────────────────────────
      // Body: 0.45×0.6×0.45 at (4.2, 2.4, 3.5)
      drawIsoBlock(ctx, 4.2,  2.4,  3.5,  0.45, 0.6,  0.45, '#F5E6C8','#C87840','#A06030');
      // Coffee surface: 0.35×0.05×0.35, inset on top
      drawIsoBlock(ctx, 4.25, 3.0,  3.55, 0.35, 0.05, 0.35, '#3A1F0A','#2A1205','#1A0A02');
      // Handle: 0.15×0.4×0.05, on +x (right) face, centred vertically and in z
      drawIsoBlock(ctx, 4.65, 2.5,  3.70, 0.15, 0.4,  0.05, '#A06030','#884820','#663810');
    }

    // ── Step 8a: Wall clock (2D canvas, left wall x=0) ───────────────
    function drawClock(ctx) {
      const p = toScreen(0, 5, 4);
      const cx = p.x, cy = p.y;
      const R = BASE_PIXEL * 3.5, r = BASE_PIXEL * 3;

      ctx.save();

      // Outer ring
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.fillStyle = '#F5E6C8'; ctx.fill();
      ctx.strokeStyle = '#6B4423'; ctx.lineWidth = 2; ctx.stroke();

      // Inner face
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = '#FFF8EE'; ctx.fill();

      // 12 hour marks
      ctx.strokeStyle = '#333333'; ctx.lineWidth = 1;
      for (let i = 0; i < 12; i++) {
        const a = i / 12 * Math.PI * 2 - Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * r * 0.82, cy + Math.sin(a) * r * 0.82);
        ctx.lineTo(cx + Math.cos(a) * r * 0.97, cy + Math.sin(a) * r * 0.97);
        ctx.stroke();
      }

      // Hour hand (~10 o'clock:  −150° from 3-o'clock reference)
      const hA = -Math.PI * 5 / 6;
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(hA) * r * 0.55, cy + Math.sin(hA) * r * 0.55);
      ctx.strokeStyle = '#222222'; ctx.lineWidth = 2; ctx.stroke();

      // Minute hand (~2 o'clock: −30°)
      const mA = -Math.PI / 6;
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(mA) * r * 0.80, cy + Math.sin(mA) * r * 0.80);
      ctx.strokeStyle = '#444444'; ctx.lineWidth = 1.5; ctx.stroke();

      // Centre dot
      ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#333333'; ctx.fill();

      ctx.restore();
    }

    // ── Step 8b: Framed picture (2D canvas, front wall z≈8) ──────────
    function drawFramedPicture(ctx) {
      const p = toScreen(5, 4, 8);
      const cx = p.x, cy = p.y;
      const fw = BASE_PIXEL * 10, fh = BASE_PIXEL * 8;

      ctx.save();

      // Outer wood frame
      ctx.fillStyle = '#6B4423';
      ctx.fillRect(cx - fw / 2, cy - fh / 2, fw, fh);

      // Inner art area (4 px inset all sides)
      const ix = cx - fw / 2 + 4, iy = cy - fh / 2 + 4;
      const iw = fw - 8,           ih = fh - 8;

      // Sky
      ctx.fillStyle = '#87CEEB';
      ctx.fillRect(ix, iy, iw, ih);

      // Mountain 1 — left, darker
      ctx.beginPath();
      ctx.moveTo(ix,              iy + ih * 0.72);
      ctx.lineTo(ix + iw * 0.42,  iy + ih * 0.22);
      ctx.lineTo(ix + iw * 0.72,  iy + ih * 0.72);
      ctx.closePath();
      ctx.fillStyle = '#4A7C59'; ctx.fill();

      // Mountain 2 — right, lighter (slightly overlapping)
      ctx.beginPath();
      ctx.moveTo(ix + iw * 0.32,  iy + ih * 0.72);
      ctx.lineTo(ix + iw * 0.65,  iy + ih * 0.30);
      ctx.lineTo(ix + iw,          iy + ih * 0.72);
      ctx.closePath();
      ctx.fillStyle = '#6B9A6B'; ctx.fill();

      // Ground strip
      ctx.fillStyle = '#8B6040';
      ctx.fillRect(ix, iy + ih * 0.72, iw, ih * 0.28);

      ctx.restore();
    }

    // ── Step 8c: Sticky notes (2D canvas, left wall x=0) ─────────────
    function drawStickyNotes(ctx) {
      const notes = [
        { gx: 0, gy: 3,   gz: 5,   color: '#FFE066', rot:  0.05 },
        { gx: 0, gy: 3.5, gz: 5.5, color: '#FF9966', rot: -0.05 },
        { gx: 0, gy: 4,   gz: 5,   color: '#66CCFF', rot:  0.03 },
      ];
      const s = BASE_PIXEL * 4;

      for (const { gx, gy, gz, color, rot } of notes) {
        const p = toScreen(gx, gy, gz);
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(rot);

        // Note body
        ctx.fillStyle = color;
        ctx.fillRect(-s / 2, -s / 2, s, s);

        // Simulated text lines
        ctx.strokeStyle = 'rgba(0,0,0,0.22)';
        ctx.lineWidth = 0.8;
        for (let l = 0; l < 3; l++) {
          const ly = -s / 2 + s * (0.28 + l * 0.24);
          ctx.beginPath();
          ctx.moveTo(-s / 2 + s * 0.12, ly);
          ctx.lineTo( s / 2 - s * 0.12, ly);
          ctx.stroke();
        }

        ctx.restore();
      }
    }

    // ── Scene — painter order: ascending (x+z) ────────────────────────
    function drawScene(ctx) {
      ctx.clearRect(0, 0, W, H);
      drawFloorShadows(ctx);      // shadows under furniture (before all objects)
      drawRoom(ctx);              // floor + walls          x+z  0–16
      drawWindow(ctx);            // left wall              x+z ≈  3
      drawLargePlant(ctx);        // floor, back-left       x+z ≈  3.5
      drawClock(ctx);             // left wall, high        x+z ≈  4
      drawStickyNotes(ctx);       // left wall              x+z ≈  5
      drawChair(ctx);             // floor, front of desk   x+z ≈  5
      drawDesk(ctx);              // center room            x+z ≈  5–10
      drawDeskItems(ctx);         // monitor/kbd/mouse      x+z ≈  7–9
      drawSmallDeskPlant(ctx);    // on desk back-left      x+z ≈  7
      drawDeskSmallItems(ctx);    // lamp, notebook, mug    x+z ≈  7–8
      drawTallCornerPlant(ctx);   // floor, mid corner      x+z ≈  8.5
      drawFramedPicture(ctx);     // front wall             x+z ≈ 13
      drawBookshelf(ctx);         // near front             x+z ≈ 13
      drawAmbientLight(ctx);      // warm + cool overlay (last)
    }

    // ── Render loop ───────────────────────────────────────────────────
    function loop() {
      if (showCamera) {
        camCtx.clearRect(0, 0, W, H);
        drawCamera();
      }
      drawScene(artCtx);
      requestAnimationFrame(loop);
    }
    loop();

    // ── Controls ──────────────────────────────────────────────────────
    // Tap/click to reposition scene origin; sync offset sliders
    artCanvas.addEventListener('pointerdown', e => {
      originX = e.clientX;
      originY = e.clientY;
      offsetX = originX - W * 0.5;
      offsetY = originY - H * 0.42;
      document.getElementById('ox-slider').value = Math.round(offsetX);
      document.getElementById('oy-slider').value = Math.round(offsetY);
      document.getElementById('ox-val').textContent = Math.round(offsetX);
      document.getElementById('oy-val').textContent = Math.round(offsetY);
    });

    // BASE_PIXEL slider
    const slider  = document.getElementById('pixel-slider');
    const pxLabel = document.getElementById('px-val');
    slider.addEventListener('input', () => {
      BASE_PIXEL = +slider.value;
      pxLabel.textContent = BASE_PIXEL;
    });

    // X/Y offset sliders
    const oxSlider = document.getElementById('ox-slider');
    const oxVal    = document.getElementById('ox-val');
    oxSlider.addEventListener('input', () => {
      offsetX = +oxSlider.value;
      oxVal.textContent = offsetX;
      resetOrigin();
    });

    const oySlider = document.getElementById('oy-slider');
    const oyVal    = document.getElementById('oy-val');
    oySlider.addEventListener('input', () => {
      offsetY = +oySlider.value;
      oyVal.textContent = offsetY;
      resetOrigin();
    });

    // Toggle camera visibility
    const camBtn = document.getElementById('cam-toggle');
    camBtn.addEventListener('click', () => {
      showCamera = !showCamera;
      camCanvas.style.display = showCamera ? '' : 'none';
      camBtn.textContent = showCamera ? 'Hide cam' : 'Show cam';
    });
  </script>
</body>
